name: Release

on:
  push:
    tags:
      - '**'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish Gradle plugin
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew sample/gradlew

      - name: Publish Gradle plugin
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :plugin:publishPlugins --no-daemon --stacktrace

      - name: Generate HTML report
        working-directory: sample
        run: ./gradlew :app:analyzeDebugAlignment --no-daemon --stacktrace

      - name: Prepare Pages artifact
        run: |
          mkdir -p public
          REPORT="$(find sample/app/build/reports/elf-16k-alignment -name elf-16k-alignment.html -print -quit 2>/dev/null || true)"
          if [ -n "$REPORT" ]; then
            cp "$REPORT" public/index.html
          else
            printf '%s\n' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ELF 16K Alignment Report</title></head><body><h1>ELF 16K Alignment Report</h1><p>No HTML report was generated for this release.</p></body></html>' > public/index.html
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Checkout default branch
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Update README version
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          VERSION="${TAG#v}"
          perl -0pi -e "s/classpath\\(\"io\\.github\\.5peak2me\\.gradle:elf-16k-alignment:[^\"]+\"\\)/classpath(\"io.github.5peak2me.gradle:elf-16k-alignment:${VERSION}\")/g" README.md README.zh_CN.md
          perl -0pi -e "s/id\\(\"elf-16k-alignment\"\\) version \"[^\"]+\"/id(\"elf-16k-alignment\") version \"${VERSION}\"/g" README.md README.zh_CN.md
          perl -0pi -e "s/elf-alignment = \\{ id = \"elf-16k-alignment\", version = \"[^\"]+\" \\}/elf-alignment = { id = \"elf-16k-alignment\", version = \"${VERSION}\" }/g" README.md README.zh_CN.md
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}

      - name: Commit README version
        if: github.event_name != 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh_CN.md
          git diff --cached --quiet || git commit -m "docs: update README version to ${TAG#v}"
          git push
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
